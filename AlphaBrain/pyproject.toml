[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "AlphaBrain"
authors = [
]
description = "AlphaBrain"
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vision-language-actions models", " robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
"Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "msgpack>=1.0",
    "PyYAML>=6.0",
    "openai>=1.0",
    "requests>=2.28",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
    "pyarrow>=14.0",
    "Pillow>=9.0",
    "numpy>=1.24",
]

[project.scripts]
"sepa-eval" = "sepa_eval.__main__:main"

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]
sagemaker = [
    "boto3",
    "sagemaker"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["AlphaBrain*", "sepa_eval*"]
exclude = [
    "tests",
    "cache",
    "playground",
    "results",
    "checkpoints",
    "scripts",
    ".vscode",
    "*.egg-info",
]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
